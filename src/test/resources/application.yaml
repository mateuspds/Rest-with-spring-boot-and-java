server:
  port: 8888
spring:
  application:
    name: rest-winth-spring-boot-and-java
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
    show-sql: false
    open-in-view: false
logging:
  level:
    # root: warn
    com.example: DEBUG
Spring-doc:
  paths-to-match: /api/**/v1/**
  swagger-ui:
    use-root-path: true


